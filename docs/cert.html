<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Certificate of Completion · AI Concepts</title>
<meta name="description" content="A certificate of completion from the AI Concepts course.">
<meta property="og:type" content="website">
<meta property="og:title" content="Certificate of Completion · AI Concepts">
<meta property="og:description" content="Awarded for completing a test in the AI Concepts course. Open the link to see the full certificate.">
<meta property="og:image" content="https://mjaffry01.github.io/ai-word-bank/cert-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Certificate of Completion · AI Concepts">
<meta name="twitter:image" content="https://mjaffry01.github.io/ai-word-bank/cert-preview.png">
<style>
  :root{--bg:#f4f1ea;--fg:#1d2733;--muted:#5c6b7a;--line:#d9d2c3;--accent:#0b6e69;--good:#1d7a3e;--bad:#b3261e;--card:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#121619;--fg:#e8e6e1;--muted:#9aa6b2;--line:#2c3439;--accent:#4fb3ab;--good:#5cc489;--bad:#ef7b72;--card:#1a2024}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:980px;margin:0 auto;padding:28px 16px 48px}
  h1{font:700 1.6rem Georgia,serif;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px}
  canvas{display:block;width:100%;height:auto;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
  .status{margin:18px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
  .status.ok{border-left:5px solid var(--good)}
  .status.bad{border-left:5px solid var(--bad)}
  dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:12px 0 0}
  dt{color:var(--muted)}
  dd{margin:0;font-weight:600}
  .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .btn{font:600 .95rem system-ui,sans-serif;padding:9px 16px;border-radius:999px;border:1.5px solid var(--accent);background:var(--card);color:var(--fg);text-decoration:none;cursor:pointer}
  .btn.primary{background:var(--accent);color:#fff}
  .note{color:var(--muted);font-size:.88rem;margin-top:18px}
</style>
</head>
<body>
<main>
  <h1>Certificate of Completion</h1>
  <p class="sub">Issued by the AI Concepts course</p>
  <div id="out"></div>
</main>
<script src="config.js?v=3643cbf1"></script>
<script src="cert.js?v=a3a9f46b"></script>
<script>
  // Shows a certificate. ?id=AIC-… is checked against the course records (the teacher's Google Sheet);
  // older ?c=… links carry their own details and only get a basic consistency check.
  (async function () {
    const out = document.getElementById("out"), C = window.WB_CERT, q = new URLSearchParams(location.search);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const home = `<a class="btn" href="./">Take the AI Concepts course</a>`;
    const fail = (msg) => { out.innerHTML = `<div class="status bad">${msg}</div><div class="btns">${home}</div>`; };
    function show(c, statusHtml, ok, note) {
      document.title = `${c.n} · ${c.t} · Certificate · AI Concepts`;
      out.innerHTML = "";
      const cv = C.draw(c, document.createElement("canvas"));
      out.appendChild(cv);
      const box = document.createElement("div");
      box.innerHTML = `<div class="status ${ok ? "ok" : "bad"}">${statusHtml}
        <dl><dt>Name</dt><dd>${esc(c.n)}</dd><dt>Test</dt><dd>${esc(c.t)}</dd><dt>Score</dt><dd>${c.s} / ${c.o} (${C.pct(c)}%)</dd><dt>Date</dt><dd>${esc(C.longDate(c.d))}</dd><dt>Certificate ID</dt><dd>${esc(c.id || "")}</dd><dt>Signed by</dt><dd>${esc(C.SIGNER.name)}, ${esc(C.SIGNER.title)}</dd></dl></div>
        <div class="btns"><button class="btn primary" id="dl">Download image</button>${home}</div>
        <p class="note">${note}</p>`;
      out.appendChild(box);
      document.getElementById("dl").addEventListener("click", () => { const a = document.createElement("a"); a.href = cv.toDataURL("image/png"); a.download = `AI-Concepts-certificate-${c.id || "certificate"}.png`; a.click(); });
    }
    await C.sigReady;

    const id = (q.get("id") || "").trim().toUpperCase();
    if (id) {
      out.innerHTML = `<div class="status">Checking certificate ${esc(id)} with the course records…</div>`;
      let r = null;
      try {
        const res = await fetch(window.WB_CONFIG.api, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "verifyCertificate", id }) });
        r = await res.json();
      } catch (e) { return fail("<b>Couldn't reach the course records just now.</b> Check your connection and reload this page."); }
      if (!r || !r.ok) return fail("<b>Couldn't check this certificate just now.</b> Please reload the page.");
      if (!r.found) return fail(`<b>✗ No certificate with ID ${esc(id)} exists in the course records.</b> Check that the whole link was copied.`);
      const c = { n: r.name, t: r.test, s: r.score, o: r.total, d: r.issued, id: r.id };
      if (r.status === "revoked") return show(c, "<b>✗ This certificate has been revoked by the course instructor.</b>", false, "A revoked certificate is no longer valid.");
      return show(c, `<b>✓ Verified.</b> This certificate is recorded in the AI Concepts course records, issued on ${esc(C.longDate(r.issued))}.`, true, "The details above come from the course records, not from the link, so they can't be edited by whoever shares it.");
    }

    let c = null;
    try { c = C.unb64(q.get("c") || ""); } catch (e) {}
    if (!c || !c.n || !c.t || !(c.o > 0)) return fail("<b>No certificate found in this link.</b> Check that the whole link was copied.");
    const details = { n: c.n, t: c.t, s: c.s, o: c.o, d: c.d }, ok = c.i === C.code(details);
    show(Object.assign({ id: c.i }, details), ok ? "<b>Older certificate link.</b> Its details match its ID, but it was issued before certificates were recorded, so it can't be checked against the course records." : "<b>✗ This link has been altered:</b> its details don't match the certificate ID.", ok, "Certificates issued from now on are recorded with the instructor and can be fully verified.");
  })();
</script>
</body>
</html>
